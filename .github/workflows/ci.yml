name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-dev.txt pandas pyflakes
      - name: Static check (undefined names, unused imports)
        run: python -m pyflakes api examples clients/python tests/test_api.py tests/test_v1.py tests/test_client.py tests/test_socket.py tests/test_ws_client.py tests/test_providers.py tests/test_examples.py
      - name: Offline tests (no network needed)
        run: python -m pytest tests/test_api.py tests/test_v1.py tests/test_client.py tests/test_socket.py tests/test_ws_client.py tests/test_providers.py tests/test_examples.py -q

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check clients/js/index.js && node --check frontend/script.js && node --check examples/node_quickstart.mjs
      - name: SDK tests
        run: node --test clients/js/test.mjs
